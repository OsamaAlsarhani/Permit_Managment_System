version: '3.8'

volumes:
  postgres-data:
  minio-data:

services:
  postgres:
    image: postgres:15
    container_name: pms-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: pms-minio
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./minio-data-old:/data
    command: server /data --console-address ":9001"

  backend:
    build: .
    container_name: pms-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_MINIO_URL: http://minio:9000
      # Internal Docker network
      SPRING_MINIO_PUBLIC_URL: http://localhost:9000  # Browser-accessible
      SPRING_MINIO_ACCESS_KEY: minioadmin
      SPRING_MINIO_SECRET_KEY: minioadmin123
      SPRING_MINIO_BUCKET: mybucket
