spring:
  application:
    name: PermitManagementSystem

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: admin
      password: secret

minio:
  url: ${SPRING_MINIO_URL:http://localhost:9000}  # Internal Docker access (for backend)
  #public-url: ${SPRING_MINIO_PUBLIC_URL:http://localhost:9000}  # For presigned URLs (frontend)
  access-key: ${SPRING_MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${SPRING_MINIO_SECRET_KEY:minioadmin123}
  bucket: ${SPRING_MINIO_BUCKET:mybucket}
